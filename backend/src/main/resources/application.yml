server:
  port: ${PORT:9630}

spring:
  application:
    name: smart-attendance-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:mysql://localhost:3306/smart_attendance_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false

  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 500MB

# JWT Config
jwt:
  secret: ${JWT_SECRET:koi_bhi_lambi_random_string_yaha_daalo123456}
  expiration-ms: 86400000

# Python AI Service URL
ai-service:
  base-url: ${AI_SERVICE_URL:http://localhost:8000}

# File storage paths
file:
  upload-dir: ${UPLOAD_DIR:./uploads}

# Allowed frontend origin for CORS (e.g. https://your-app.vercel.app or * for all)
frontend:
  origin: ${FRONTEND_ORIGIN:*}
